name: Site Comercial PHP QA
on:
  push:
    branches: [main, homologacao]
  pull_request:
    branches: [main, homologacao]
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none
      - name: Validar sintaxe PHP
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Testar checkout demonstrativo
        run: |
          php tests/checkout_test.php
          php tests/catalog_bridge_test.php
          php tests/mp_checkout_bridge_test.php
      - name: Confirmar isolamento de pagamentos
        run: |
          if grep -REn '(api\.mercadopago\.com|card_number|card_token_id|access_token|commerce_master_key|rm -rf|rsync .*--delete)' --include='*.php' .; then
            echo 'Código de pagamento ou operação destrutiva não autorizada encontrado.'
            exit 1
          fi
